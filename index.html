    <script>
      // Gracefully silence benign Vite HMR WebSocket connection errors in iframe proxy environment
      window.addEventListener('error', function (e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('vite'))) {
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
